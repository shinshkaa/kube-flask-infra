---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}-flask-route
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
    - name: {{ .Release.Name }}-gateway
      sectionName: http
      kind: Gateway

  hostnames:
    - {{ .Values.gateway.host | quote }}

  rules:
     - matches:
        - path:
            type: PathPrefix
            value: /

       backendRefs:
        - name: {{ .Release.Name }}-service
          namespace: {{ .Release.Namespace }}
          port: {{ .Values.service.port }}
